spring.application.name=selfbill-api

# Desktop app: only this machine may connect (PENDIENTES, "Expuesto a la red")
server.address=127.0.0.1
# SpaWebConfig owns static files, so the front's routes fall back to index.html
spring.web.resources.add-mappings=false

# WAL: readers do not block writers. IMMEDIATE: each transaction takes the write lock when it starts, so
# concurrent writes wait their turn instead of failing with SQLITE_BUSY
spring.datasource.url=jdbc:sqlite:./selfbill.db?foreign_keys=true&journal_mode=WAL&transaction_mode=IMMEDIATE
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.serialization-mode=via-dto

logging.level.org.hibernate=WARN

springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Outside selfbill.db so a copy of the database alone does not expose stored credentials
selfbill.credentials.key-file=${user.home}/.selfbill/secret.key

# Connect, read and write timeout towards the mail server
selfbill.smtp.timeout=30s
