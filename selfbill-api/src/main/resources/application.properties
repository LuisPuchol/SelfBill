spring.application.name=selfbill-api

spring.datasource.url=jdbc:sqlite:./selfbill.db?foreign_keys=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.serialization-mode=via-dto

logging.level.org.hibernate=WARN

springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Outside selfbill.db so a copy of the database alone does not expose stored credentials
selfbill.credentials.key-file=${user.home}/.selfbill/secret.key
