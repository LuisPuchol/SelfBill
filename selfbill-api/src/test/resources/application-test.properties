# A fresh database per test run: Flyway's SQLite clean cannot drop tables with foreign keys on
spring.datasource.url=jdbc:sqlite:target/selfbill-test-${random.uuid}.db?foreign_keys=true&journal_mode=WAL&transaction_mode=IMMEDIATE
spring.jpa.hibernate.ddl-auto=validate
selfbill.credentials.key-file=target/test-secret.key

# Short, so a test against a silent mail server does not take long
selfbill.smtp.timeout=5s
